<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Either Live Admin Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="login-screen">
        <section class="login-card">
            <div class="eyebrow">EITHER LIVE</div>
            <h1>ADMIN LOGIN</h1>
            <p>Enter the admin password to manage question sets and start games.</p>

            <form method="post" action="/login" class="login-form">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    autofocus
                >
                <button class="primary" type="submit">LOG IN</button>
            </form>

            <p id="login-error" class="login-error hidden">Incorrect password. Try again.</p>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('login-error').classList.remove('hidden');
        }
    </script>
</body>
</html>
