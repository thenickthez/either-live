<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Either Live - Play</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
    <main class="screen">

        <div class="eyebrow">
            EITHER LIVE
        </div>

        <h1 id="player-headline">
            WOULD YOU RATHER?
        </h1>

        <section id="player-game">
            <div
                id="progress"
                class="status"
            >
                JOINING GAME...
            </div>

            <p id="message">
                Look at the big screen.
            </p>

            <div class="choices">
                <button
                    id="a"
                    class="choice"
                    type="button"
                    disabled
                >
                    Waiting...
                </button>

                <button
                    id="b"
                    class="choice"
                    type="button"
                    disabled
                >
                    Waiting...
                </button>
            </div>
        </section>

        <section
            id="personal-results"
            class="personal-results hidden"
        >
            <p class="results-intro">
                See how your choices compared with everyone else.
            </p>

            <div id="personal-results-list"></div>

            <div class="overall-result">
                <div class="eyebrow">
                    OVERALL
                </div>

                <div
                    id="overall-percent"
                    class="overall-percent"
                ></div>

                <p id="overall-copy"></p>
            </div>

            <p class="thanks-message">
                Thanks for playing!
            </p>
        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/player.js"></script>
</body>

</html>
